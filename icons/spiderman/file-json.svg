<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Schematic Tech Frame -->
  <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" fill="#13161f" stroke="#252c3d" stroke-width="1.2"/>
  <!-- Corner Schematic Grid Marks -->
  <path d="M5 2.5 V5.5 H2.5 M19 2.5 V5.5 H21.5 M2.5 18.5 H5.5 V21.5 M21.5 18.5 H18.5 V21.5" stroke="#3e485e" stroke-width="0.8"/>
  
  <!-- Left Side Data Bus Terminals -->
  <circle cx="6" cy="7.5" r="1.2" fill="#56b6c2"/>
  <circle cx="6" cy="12" r="1.2" fill="#e5c07b"/>
  <circle cx="6" cy="16.5" r="1.2" fill="#98c379"/>
  
  <!-- Schematic Circuit Traces -->
  <path d="M7.2 7.5 H10.5 L12 9 H15" stroke="#56b6c2" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.2 12 H14" stroke="#e5c07b" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M7.2 16.5 H10.5 L12 15 H16" stroke="#98c379" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Node Points / Data Registers -->
