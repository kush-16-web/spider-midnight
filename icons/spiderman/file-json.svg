  <rect x="14" y="11" width="5" height="2" rx="0.5" fill="#e5c07b" opacity="0.85"/>
  <rect x="16" y="14" width="3" height="2" rx="0.5" fill="#98c379" opacity="0.85"/>

  <!-- Subtle Center Curly Bracket Glyph Trace in Web Crimson Accent -->
  <path d="M10 5.5 C8.8 5.5 8.5 6.2 8.5 7.2 V9.5 C8.5 10.3 8 10.8 7.3 11 C8 11.2 8.5 11.7 8.5 12.5 V14.8 C8.5 15.8 8.8 16.5 10 16.5" stroke="#e05a5a" stroke-width="0.85" fill="none" opacity="0.4"/>
</svg>
